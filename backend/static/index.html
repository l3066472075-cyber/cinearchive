<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>寻影者 · 人生电影的深度档案馆</title>
  <meta name="description" content="从多部经典电影中，为您挑选适合当下心境的影片——影视教育 × 艺术治疗。" />
  <meta name="theme-color" content="#100e0c" />
  <!-- 分享卡片（Open Graph / 微信 / 微博） -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="寻影者 · 人生电影的深度档案馆" />
  <meta property="og:description" content="从多部经典电影中，为您挑选适合当下心境的影片。" />
  <meta property="og:image" content="/static/share.png" />
  <meta property="og:site_name" content="禅说电影 · 寻影者" />
  <meta itemprop="name" content="寻影者 · 人生电影的深度档案馆" />
  <meta itemprop="description" content="从多部经典电影中，为您挑选适合当下心境的影片。" />
  <meta itemprop="image" content="/static/share.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="site-header">
    <a class="brand" href="#top">
      <span class="brand__mark">禅说电影</span>
      <span class="brand__cn">寻影者</span>
    </a>
    <span class="brand__tagline">观电影法 · 借影观心</span>
    <button class="api-link" id="growth-btn">🪔 我的观心</button>
  </header>

  <main id="top">
    <!-- ============ Hero / 推荐 ============ -->
    <section class="hero" id="recommend">
      <div class="hero__inner">
        <p class="hero__eyebrow">影视教育 × 艺术治疗</p>
        <h1 class="hero__title">
          人生如戏，<br />
          <em>观影观己</em>
        </h1>
        <p class="hero__ai-note" style="display:none"></p>
      </div>
    </section>

    <!-- ============ 看别人的电影 · 5问选片 ============ -->
    <section class="guide-section" id="guide">
      <div class="container">
        <div class="section-head">
          <h2 class="board-title">看别人的电影</h2>
          <p class="board-sub">此刻的你，需要哪部电影？</p>
          <button class="board-enter" id="guide-enter"><span>开始选片 →</span></button>
        </div>

        <div class="wizard" id="wizard" hidden>
          <div class="wizard__progress"><span id="wizard-progress"></span></div>
          <p class="wizard__step" id="wizard-step">第 1 / 5 问</p>
          <h2 class="wizard__question" id="wizard-question"></h2>
          <div class="wizard__chips" id="wizard-chips"></div>
          <div class="wizard__nav">
            <button class="mini-btn" id="wizard-back" hidden>← 上一步</button>
            <button class="ask-box__submit" id="wizard-next"><span>下一步 →</span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 为你挑选（推荐结果） ============ -->
    <section class="results" id="results" hidden>
      <div class="container">
        <header class="results__head">
          <div>
            <p class="section-kicker">为你挑选</p>
            <h2 class="results__query">“<span id="echo-query"></span>”</h2>
          </div>
          <div class="results__intent" id="intent-tags"></div>
        </header>
        <div class="results__note" id="results-note"></div>
        <div class="results__grid" id="results-grid"></div>
      </div>
    </section>

    <!-- ============ 看自己的人生电影 ============ -->
    <section class="life-section" id="life">
      <div class="container">
        <div class="section-head">
          <h2 class="board-title">看自己的人生电影</h2>
          <p class="section-sub">每个人的人生都是一部电影。</p>
          <button class="board-enter" id="life-enter"><span>开始观己 →</span></button>
        </div>

        <!-- 角色档案表单 -->
        <div id="life-form" hidden>
          <p class="life-form__tip">角色档案 · 初步体验，像看电影般看自己的人生</p>
          <div class="life-q">
            <label class="life-q__label">🎭 角色名</label>
            <input id="life-role-name" placeholder="你在人生这部电影里，叫什么名字？" />
          </div>
          <div class="life-q">
            <label class="life-q__label">🎬 你的人生电影名</label>
            <input id="life-movie-name" placeholder="为你的人生电影，起一个片名" />
          </div>
          <div class="life-q">
            <label class="life-q__label">🌱 你的出生故事（0-6 岁）</label>
            <textarea id="life-born" rows="3" placeholder="你从哪里来？最早的记忆、家庭、来处…"></textarea>
          </div>
          <div class="life-q">
            <label class="life-q__label">🌊 你的转折（重要）故事</label>
            <textarea id="life-turning" rows="3" placeholder="人生中重要的转折点、改变了你的事…"></textarea>
          </div>
          <div class="life-q">
            <label class="life-q__label">🎥 你正在经历的故事（2026）</label>
            <textarea id="life-2026" rows="3" placeholder="现在正在上演的，以及你期待接下来怎么演…"></textarea>
          </div>
          <div style="margin-top:14px"><button class="ask-box__submit" id="life-submit"><span>放映我的人生电影</span></button></div>
        </div>

        <!-- 人生电影结果（含可保存海报） -->
        <div class="life-result" id="life-result" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div>
        <span class="brand__mark">禅说电影</span>
        <span class="brand__cn">寻影者</span>
      </div>
      <p>影视教育 · 艺术治疗 · 帮你找到适合当下心境的那部影片</p>
      <p class="site-footer__fine">每一次寻影，都是一次借电影看见自己</p>
    </div>
  </footer>

  <!-- 影片详情弹层 -->
  <div class="modal" id="movie-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="关闭">✕</button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <!-- 我的观心（成长中心）弹层 -->
  <div class="modal" id="growth-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="关闭">✕</button>
      <div class="modal__body" id="growth-body"></div>
    </div>
  </div>

  <!-- 登录弹层 -->
  <div class="modal" id="login-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog modal__dialog--sm" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="关闭">✕</button>
      <div class="modal__body" id="login-body"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
