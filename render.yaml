# Render 一键部署蓝图：推到 GitHub 后，在 Render 点「New Blueprint Instance」即可。
services:
  - type: web
    name: cinearchive
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # 免费大模型（智谱 GLM-4-Flash，完全免费；也可换成 DeepSeek/通义等）
      - key: LLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: LLM_MODEL
        value: glm-4-flash
      # 下面两个 key 需要在 Render 界面里手动填（或用 .env）
      - key: LLM_API_KEY
        sync: false
      - key: CINELIB_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
